name: Host replay

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  portable-x86:
    name: Portable x86/Linux correctness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake jq binutils

      - name: Require x86-64 runner
        run: test "$(uname -m)" = "x86_64"

      - name: Regenerate and verify deterministic fixtures
        run: |
          python3 scripts/generate_synthetic_iq.py
          python3 scripts/generate_acquisition_fixtures.py
          python3 scripts/update_fixture_checksums.py --check
          git diff --exit-code -- data/synthetic

      - name: Configure strict portable build
        run: >-
          cmake -S . -B build/ci-portable
          -DCMAKE_BUILD_TYPE=Release
          -DSATCOMFEC_ENABLE_NEON=OFF
          -DSATCOMFEC_ENABLE_SME2=OFF
          -DSATCOMFEC_ENABLE_WARNINGS=ON
          -DSATCOMFEC_WARNINGS_AS_ERRORS=ON

      - name: Build portable tools
        run: cmake --build build/ci-portable --parallel

      - name: Verify translation-unit flag separation
        run: >-
          python3 scripts/check_compile_commands.py
          --build-dir build/ci-portable
          --expect portable

      - name: Run portable CTests
        run: ctest --test-dir build/ci-portable --output-on-failure

      - name: Verify replay, trust, acquisition, and FEC workflows
        run: |
          bash scripts/check_replay_demo.sh
          bash scripts/compare_trust_cases.sh
          bash scripts/check_acquisition_demo.sh
          bash scripts/check_acquisition_neon.sh
          bash scripts/check_sme2_acquisition.sh
          bash scripts/validate_decoder_alignment.sh
          bash scripts/check_branch_metrics.sh

      - name: Run all Python regressions
        env:
          SATCOMFEC_BUILD_DIR: build/ci-portable
        run: python3 -m unittest discover -s tests -v

  arm64-neon:
    name: Native Arm64/Linux NEON correctness
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and inspection tools
        run: sudo apt-get update && sudo apt-get install -y cmake jq binutils

      - name: Require AArch64 runner
        run: test "$(uname -m)" = "aarch64"

      - name: Verify deterministic fixtures
        run: python3 scripts/update_fixture_checksums.py --check

      - name: Configure explicit NEON build
        run: >-
          cmake -S . -B build/ci-neon
          -DCMAKE_BUILD_TYPE=Release
          -DSATCOMFEC_ENABLE_NEON=ON
          -DSATCOMFEC_ENABLE_SME2=OFF
          -DSATCOMFEC_ENABLE_WARNINGS=ON
          -DSATCOMFEC_WARNINGS_AS_ERRORS=ON

      - name: Build explicit NEON tools
        run: cmake --build build/ci-neon --parallel

      - name: Verify translation-unit flag separation
        run: >-
          python3 scripts/check_compile_commands.py
          --build-dir build/ci-neon
          --expect neon

      - name: Run native Arm64 CTests and equivalence checks
        run: ctest --test-dir build/ci-neon --output-on-failure

      - name: Execute NEON and inspect object instructions
        run: bash scripts/verify_acquisition_neon.sh

      - name: Run non-authoritative benchmark smoke test
        run: >-
          build/ci-neon/benchmark_acquisition
          --workload small
          --warmup-rounds 0
          --samples 3
          --min-sample-ms 1
          > build/ci-neon/non-authoritative-smoke.json

      - name: Run all regressions with NEON requested
        env:
          SATCOMFEC_BUILD_DIR: build/ci-neon
          SATCOMFEC_ENABLE_NEON: "ON"
        run: python3 -m unittest discover -s tests -v

  portable-sanitizers:
    name: Portable x86 ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Configure sanitizer build
        run: >-
          cmake -S . -B build/ci-sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DSATCOMFEC_ENABLE_NEON=OFF
          -DSATCOMFEC_ENABLE_SME2=OFF
          -DSATCOMFEC_ENABLE_WARNINGS=ON
          -DSATCOMFEC_WARNINGS_AS_ERRORS=ON
          -DSATCOMFEC_ENABLE_SANITIZERS=ON

      - name: Build with ASan and UBSan
        run: cmake --build build/ci-sanitizers --parallel

      - name: Verify portable flag separation
        run: >-
          python3 scripts/check_compile_commands.py
          --build-dir build/ci-sanitizers
          --expect portable

      - name: Run CTests under ASan and UBSan
        run: ctest --test-dir build/ci-sanitizers --output-on-failure

  sme2-compile-assembly:
    name: SME2 compile and assembly evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK r29
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager}" ]]; then
            sdkmanager="$(find "${sdk_root}/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
          fi
          if [[ -z "${sdkmanager}" || ! -x "${sdkmanager}" ]]; then
            echo "Android sdkmanager was not found under ${sdk_root}" >&2
            exit 1
          fi
          "${sdkmanager}" --install "ndk;29.0.14206865"
          ndk_root="${sdk_root}/ndk/29.0.14206865"
          if [[ ! -f "${ndk_root}/build/cmake/android.toolchain.cmake" ]]; then
            echo "Android NDK installation is incomplete at ${ndk_root}" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=${ndk_root}" >> "${GITHUB_ENV}"

      - name: Compile and inspect genuine SME2 acquisition object
        run: >-
          bash scripts/verify_android_benchmark_build.sh
          --ndk "${ANDROID_NDK_HOME}"
          --sme2 on
