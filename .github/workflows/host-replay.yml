name: Host replay

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  host-replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Regenerate deterministic IQ assets
        run: |
          python3 scripts/generate_synthetic_iq.py
          python3 scripts/generate_acquisition_fixtures.py

      - name: Check canned replay output
        run: bash scripts/check_replay_demo.sh

      - name: Compare healthy and impaired trust cases
        run: bash scripts/compare_trust_cases.sh

      - name: Check decoder alignment
        run: bash scripts/validate_decoder_alignment.sh

      - name: Check branch-metric path alignment
        run: bash scripts/check_branch_metrics.sh

      - name: Check scalar acquisition fixtures
        run: bash scripts/check_acquisition_demo.sh

      - name: Check portable NEON availability reporting
        run: bash scripts/check_acquisition_neon.sh

      - name: Check portable SME2 availability reporting
        run: bash scripts/check_sme2_acquisition.sh

      - name: Validate portable acquisition benchmark report
        run: >-
          bash scripts/benchmark_acquisition.sh
          --workload small
          --warmup-rounds 0
          --samples 3
          --min-sample-ms 1
          > build/acquisition-benchmark-smoke.json

      - name: Verify Arm build modes
        run: bash scripts/verify_arm_paths.sh

      - name: Run automated host replay tests
        run: python3 -m unittest discover -s tests -v

  arm64-neon:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and inspection tools
        run: sudo apt-get update && sudo apt-get install -y cmake jq binutils

      - name: Regenerate deterministic acquisition assets
        run: python3 scripts/generate_acquisition_fixtures.py

      - name: Build explicit AArch64 NEON configuration
        run: |
          cmake -S . -B build/ci-neon \
            -DCMAKE_BUILD_TYPE=Release \
            -DSATCOMFEC_ENABLE_NEON=ON
          cmake --build build/ci-neon --parallel

      - name: Run CTest on Arm64
        run: ctest --test-dir build/ci-neon --output-on-failure

      - name: Validate native NEON acquisition benchmark report
        run: >-
          build/ci-neon/benchmark_acquisition
          --workload small
          --warmup-rounds 0
          --samples 3
          --min-sample-ms 1
          > build/acquisition-benchmark-neon-smoke.json

      - name: Require NEON execution and inspect instructions
        run: bash scripts/verify_acquisition_neon.sh

      - name: Check SME2 availability without requiring SME2 hardware
        run: bash scripts/check_sme2_acquisition.sh

      - name: Run all host tests on Arm64
        env:
          SATCOMFEC_ENABLE_NEON: "ON"
        run: python3 -m unittest discover -s tests -v

  android-ndk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK r29
        run: sdkmanager --install "ndk;29.0.14206865"

      - name: Build and inspect Android SME2 acquisition benchmark
        run: >-
          bash scripts/verify_android_benchmark_build.sh
          --ndk "${ANDROID_HOME}/ndk/29.0.14206865"
          --sme2 on
